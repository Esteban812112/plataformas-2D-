# Local PostgreSQL only. The password matches backend/.env.example and is a
# placeholder for a developer machine, not a production credential.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rushbound
      POSTGRES_USER: rushbound
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - rushbound_pg:/var/lib/postgresql/data

volumes:
  rushbound_pg:
